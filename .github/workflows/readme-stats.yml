name: Update README stats cards

on:
  schedule:
    - cron: "0 4 * * *"   # todos los días a las 4am UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=michelmassaad&show_icons=true&locale=es&hide_border=true&title_color=0A66C2&text_color=8b949e&icon_color=0A66C2&bg_color=00000000
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=michelmassaad&layout=compact&locale=es&hide_border=true&title_color=0A66C2&text_color=8b949e&bg_color=00000000
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          git commit -m "Update stats cards" || exit 0
          git push
